<!DOCTYPE html>
<html>
<head><title>GSC Auth</title></head>
<body>
<p style="font-family:sans-serif;color:#666;padding:2rem;">Connecting... this window will close automatically.</p>
<script>
  try {
    var hash = window.location.hash.slice(1);
    var params = new URLSearchParams(hash);
    var token = params.get('access_token');
    if (token) {
      window.opener.postMessage({ gsc_token: token }, 'https://claude.ai');
      setTimeout(function(){ window.close(); }, 800);
    } else {
      document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem;color:red;">No token received. Close this and try again.</p>';
    }
  } catch(e) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem;color:red;">Error: ' + e.message + '</p>';
  }
</script>
</body>
</html>
